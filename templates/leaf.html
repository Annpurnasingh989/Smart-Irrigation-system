<!DOCTYPE html>
<html>
<head>
    <title>Leaf Disease Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="card">

    <h1>🌿 AI Leaf Disease Detection</h1>

    <form action="/leaf" method="POST" enctype="multipart/form-data">

        <input type="file" name="leaf" accept="image/*" required>

        <br><br>

        <button type="submit">🔍 Detect Disease</button>

    </form>

    {% if image %}
        <br>

<img src="{{ image }}" width="250"
style="border-radius:15px; box-shadow:0 5px 15px gray;">

<br><br>

<h2>{{ result }}</h2>

<p><b>💊 Treatment:</b> {{ treatment }}</p>

<p><b>🌾 Recommended Fertilizer:</b> {{ fertilizer }}</p>

<p><b>💧 Irrigation Advice:</b> {{ irrigation }}</p>

<p><b>📊 AI Confidence:</b> {{ confidence }}%</p>
    {% endif %}

    <br>

    <a href="/dashboard">
        <button>⬅ Back to Dashboard</button>
    </a>

</div>

</body>
</html>
