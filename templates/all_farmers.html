<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Farmers | Smart Irrigation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0,35,20,.65),
                    rgba(0,70,40,.55)
                ),
                url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1900&q=90");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .glass {

            background: rgba(255,255,255,.12);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,.22);

            box-shadow:
                0 15px 45px rgba(0,0,0,.25);
        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <nav class="glass sticky top-0 z-50">

        <div
            class="max-w-7xl mx-auto
                   px-6 py-4
                   flex items-center
                   justify-between">

            <div>

                <h1 class="text-xl md:text-2xl font-bold">

                    🌱 Smart Irrigation

                </h1>

                <p class="text-xs text-green-100">

                    All Farmers

                </p>

            </div>


            <a
                href="/officer"
                class="px-5 py-2
                       rounded-xl
                       bg-green-500/80
                       hover:bg-green-400
                       transition
                       font-semibold">

                ← Officer Dashboard

            </a>

        </div>

    </nav>


    <!-- MAIN -->

    <main
        class="max-w-7xl
               mx-auto
               px-6
               py-10">


        <div
            class="glass
                   rounded-3xl
                   p-7">


            <h2
                class="text-3xl
                       font-bold">

                👨‍🌾 All Registered Farmers

            </h2>


            <p
                class="text-green-100
                       mt-2
                       mb-8">

                Farmers registered in the Smart Irrigation System.

            </p>


            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead>

                        <tr
                            class="border-b
                                   border-white/20
                                   text-green-200">

                            <th class="p-4">
                                #
                            </th>

                            <th class="p-4">
                                Farmer Name
                            </th>

                            <th class="p-4">
                                Mobile Number
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        {% for farmer in farmers %}

                        <tr
                            class="border-b
                                   border-white/10
                                   hover:bg-white/10
                                   transition">

                            <td class="p-4">

                                {{ loop.index }}

                            </td>

                            <td class="p-4 font-semibold">

                                👨‍🌾 {{ farmer.name }}

                            </td>

                            <td class="p-4">

                                {{ farmer.mobile }}

                            </td>

                        </tr>

                        {% else %}

                        <tr>

                            <td
                                colspan="3"
                                class="text-center
                                       p-8
                                       text-green-100">

                                No farmers registered yet.

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</body>

</html>
